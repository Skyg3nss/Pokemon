<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chaos Chaser Scanner Test</title>
  <style>
    body{font-family:system-ui;margin:0;background:#f4f4f4;color:#222}
    main{max-width:560px;margin:auto;padding:24px}
    .card{background:white;border-radius:20px;padding:18px}
    input,button{width:100%;box-sizing:border-box;margin-top:12px}
    input{padding:12px}
    button{border:0;border-radius:14px;padding:14px;background:#9f1d2e;color:white;font-weight:700}
    pre{white-space:pre-wrap;background:#eee;padding:12px;border-radius:14px;min-height:80px}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Scanner backend test</h1>
    <p>Vul je Render URL in en kies één Pokémon-kaartfoto.</p>
    <input id="url" placeholder="https://chaos-chaser-scanner.onrender.com">
    <input id="file" type="file" accept="image/*">
    <button id="go">Test herkenning</button>
    <pre id="out">Nog niet getest.</pre>
  </div>
</main>
<script>
document.querySelector("#go").onclick=async()=>{
  const out=document.querySelector("#out");
  const base=document.querySelector("#url").value.replace(/\/$/,"");
  const file=document.querySelector("#file").files[0];
  if(!base||!file){out.textContent="Vul URL in + kies een foto.";return;}
  out.textContent="Uploading / recognizing…";
  const fd=new FormData();
  fd.append("image",file);
  try{
    const r=await fetch(base+"/recognize",{method:"POST",body:fd});
    const data=await r.json();
    out.textContent=JSON.stringify(data,null,2);
  }catch(e){
    out.textContent="ERROR: "+e.message;
  }
};
</script>
</body>
</html>
